[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ikiapikit"
dynamic = ["version"]
description = "Swiss-Army Knife for REST & GraphQL APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ikidevz", email = "you@example.com" }]
keywords = ["api", "rest", "graphql", "http", "data-engineering", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.2",
    "rich>=13.0",
    "orjson>=3.9",
    "tomli-w>=1.0",
    "polars>=0.20",
    "pandas>=2.0",
    "pyarrow>=14",
    "duckdb>=0.9",
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-orjson",
]

[project.urls]
Homepage      = "https://github.com/ikidevz/ikiapikit"
Documentation = "https://github.com/ikidevz/ikiapikit"
Changelog     = "https://github.com/ikidevz/ikiapikit/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ikidevz/ikiapikit/issues"

[tool.hatch.version]
path = "src/ikiapikit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ikiapikit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
addopts      = "-ra -q"

[tool.ruff.lint]
line-length    = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true